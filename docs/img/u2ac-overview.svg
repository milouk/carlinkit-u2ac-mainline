<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">U2AC dongle running mainline Linux, between an Android phone and a car</title>
  <desc id="d">An Android phone talks to the U2AC dongle over 5 GHz Wi-Fi and Bluetooth; the dongle relays Android Auto to the car's head unit over USB.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3443"/>
      <stop offset="0.55" stop-color="#1a212c"/>
      <stop offset="1" stop-color="#11161e"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213a"/>
      <stop offset="1" stop-color="#0d1628"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.35" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="22" fill="url(#bg)"/>

  <!-- phone -->
  <g transform="translate(92 92)" filter="url(#soft)">
    <rect width="108" height="206" rx="18" fill="#0a0f18" stroke="#334155" stroke-width="2"/>
    <rect x="7" y="9" width="94" height="188" rx="12" fill="url(#screen)"/>
    <circle cx="54" cy="18" r="3" fill="#1f2937"/>
    <rect x="18" y="36" width="72" height="8" rx="4" fill="#334155"/>
    <rect x="18" y="52" width="50" height="8" rx="4" fill="#263244"/>
    <rect x="18" y="80" width="72" height="54" rx="8" fill="#1d4ed8" opacity="0.55"/>
    <path d="M28 124 L46 104 L58 114 L80 92" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="146" width="72" height="8" rx="4" fill="#263244"/>
    <rect x="18" y="162" width="58" height="8" rx="4" fill="#263244"/>
  </g>

  <!-- radio waves -->
  <g fill="none" stroke="#38bdf8" stroke-linecap="round">
    <path d="M232 168 q20 27 0 54" stroke-width="4" opacity="0.95"/>
    <path d="M254 152 q32 43 0 86" stroke-width="4" opacity="0.7"/>
    <path d="M276 136 q44 59 0 118" stroke-width="4" opacity="0.45"/>
  </g>
  <text x="290" y="304" fill="#7dd3fc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">5 GHz Wi-Fi + Bluetooth</text>

  <!-- dongle -->
  <g transform="translate(352 128)" filter="url(#soft)">
    <rect width="200" height="128" rx="26" fill="url(#body)" stroke="#3a4556" stroke-width="2"/>
    <rect x="3" y="3" width="194" height="58" rx="24" fill="url(#top)"/>
    <text x="100" y="74" fill="#5b6778" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" text-anchor="middle">U2AC</text>
    <circle cx="100" cy="99" r="17" fill="url(#led)"/>
    <circle cx="100" cy="99" r="4.5" fill="#dcfce7"/>
    <!-- USB-C port -->
    <rect x="193" y="54" width="14" height="22" rx="7" fill="#0b0f15" stroke="#4b5563" stroke-width="1.5"/>
  </g>

  <!-- cable -->
  <path d="M559 192 C 600 192, 612 250, 650 250 L 678 250" fill="none" stroke="#9aa6b8" stroke-width="7" stroke-linecap="round"/>
  <rect x="676" y="241" width="26" height="18" rx="4" fill="#cbd5e1"/>
  <text x="626" y="304" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">USB (Android Open Accessory)</text>

  <!-- head unit -->
  <g transform="translate(700 130)" filter="url(#soft)">
    <rect width="214" height="146" rx="16" fill="#0a0f18" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="10" width="194" height="110" rx="8" fill="url(#screen)"/>
    <path d="M22 104 C 60 92, 70 60, 112 58 S 170 40, 192 26" fill="none" stroke="#1e3a5f" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 104 C 60 92, 70 60, 112 58 S 170 40, 192 26" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 0"/>
    <circle cx="112" cy="58" r="7" fill="#22c55e" stroke="#0d1628" stroke-width="3"/>
    <rect x="22" y="22" width="62" height="16" rx="5" fill="#1f2a3d"/>
    <circle cx="62" cy="133" r="5" fill="#334155"/>
    <circle cx="107" cy="133" r="5" fill="#334155"/>
    <circle cx="152" cy="133" r="5" fill="#334155"/>
  </g>

  <!-- captions -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="146" y="340" fill="#e5e7eb" font-size="15" font-weight="600">Android phone</text>
    <text x="146" y="360" fill="#94a3b8" font-size="12.5">wireless Android Auto</text>
    <text x="452" y="340" fill="#e5e7eb" font-size="15" font-weight="600">U2AC dongle</text>
    <text x="452" y="360" fill="#94a3b8" font-size="12.5">mainline Linux 7.2 · aa-proxy-rs</text>
    <text x="807" y="340" fill="#e5e7eb" font-size="15" font-weight="600">Car head unit</text>
    <text x="807" y="360" fill="#94a3b8" font-size="12.5">wired Android Auto</text>
  </g>
</svg>
